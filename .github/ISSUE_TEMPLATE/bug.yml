name: Fout melden
description: Iets werkt niet zoals de documentatie zegt.
labels: [bug]
body:
  - type: textarea
    id: wat
    attributes:
      label: Wat gebeurt er?
      description: Beschrijf wat je deed, wat je verwachtte en wat er gebeurde.
    validations:
      required: true
  - type: textarea
    id: reproductie
    attributes:
      label: Hoe reproduceer je het?
      description: >-
        Het commando dat je draaide, met de volledige uitvoer. Kun je het laten
        zien op het voorbeeld in examples/vergunningverlening, des te beter.
        Deel geen modelbestanden met vertrouwelijke inhoud.
      render: shell
    validations:
      required: true
  - type: input
    id: versie
    attributes:
      label: Versie
      description: De uitvoer van `archi --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Besturingssysteem
      options: [macOS, Linux, Windows, anders]
    validations:
      required: true
