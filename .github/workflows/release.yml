# Publiceer archi-cli naar PyPI bij een versie-tag (v1.2.3). Gebruikt PyPI
# Trusted Publishing (OIDC): geen API-token of secret nodig — PyPI vertrouwt
# deze workflow op basis van de repo + workflow-naam, eenmalig te koppelen in
# de PyPI-projectinstellingen. De job draait alleen op tags, niet op elke push.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false   # geen cache in een publicerende workflow

      - name: Tag matcht de versie in pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag) ≠ pyproject-versie $pkg" >&2
            exit 1
          fi
          echo "Versie $pkg klopt met de tag."

      # Nooit een versie publiceren die zijn eigen tests niet haalt: de
      # tag kan op een commit staan waar CI nooit groen op is geweest.
      - run: uv sync --locked
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # vereist voor Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
