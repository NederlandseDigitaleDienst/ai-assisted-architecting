# Publiceer archi-cli bij een versie-tag (v1.2.3): naar PyPI via Trusted
# Publishing (OIDC, geen API-token of secret; PyPI vertrouwt deze workflow op
# basis van repo en workflownaam) en als GitHub Release met de tekst uit
# CHANGELOG.md. De workflow draait alleen op tags, niet op elke push.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false   # geen cache in een publicerende workflow

      # tag, versies in alle bestanden en de changelogsectie moeten kloppen;
      # de changelogsectie wordt de tekst van de GitHub Release
      - name: Tag, versies en changelog controleren
        run: >-
          uv run --no-project python scripts/check_release.py
          --tag "$GITHUB_REF_NAME" --notes release-notes.md

      # Nooit een versie publiceren die zijn eigen tests niet haalt: de
      # tag kan op een commit staan waar CI nooit groen op is geweest.
      - run: uv sync --locked
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # vereist voor Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # vereist om een release aan te maken
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
      - name: GitHub Release aanmaken
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
