# Publiceer archi-cli naar PyPI bij een versie-tag (v1.2.3). Gebruikt PyPI
# Trusted Publishing (OIDC): geen API-token of secret nodig — PyPI vertrouwt
# deze workflow op basis van de repo + workflow-naam, eenmalig te koppelen in
# de PyPI-projectinstellingen. De job draait alleen op tags, niet op elke push.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: false   # geen cache in een publicerende workflow

      - name: Tag matcht de versie in pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag) ≠ pyproject-versie $pkg" >&2
            exit 1
          fi
          echo "Versie $pkg klopt met de tag."

      # Nooit een versie publiceren die zijn eigen tests niet haalt: de
      # tag kan op een commit staan waar CI nooit groen op is geweest.
      - run: uv sync --locked
      - run: uv run pytest

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # vereist voor Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
