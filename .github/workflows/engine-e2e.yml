# Echte end-to-end test van de engine-download: haalt de Archi-distributie op
# en draait een echte `normalize` op alle drie de platforms. Bewust géén
# onderdeel van de PR-CI: het downloadt ~165 MB en is alleen nodig als een
# nieuwe Archi-release de download-URL of de layout kan breken. Draait
# wekelijks en handmatig.
#
# Bewust zonder cache: juist de download moet elke week echt draaien, anders
# valt het niet op dat archi.io de gepinde versie heeft verwijderd (archi.io
# houdt alleen de nieuwste release online). Valt de download terug op een
# nieuwere versie, dan faalt deze job ook: gebruikers kunnen door, maar de pin
# moet omhoog. Een geplande run die faalt, opent een issue (of reageert op
# het openstaande), zodat het niet ongemerkt blijft.
name: engine-e2e

on:
  schedule:
    - cron: "0 6 * * 1"   # maandag 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync

      - name: Engine ophalen en normalize draaien
        shell: bash
        env:
          ARCHI_CACHE: engine-cache
          # read-only token: lifts the API rate limit for the checksum fallback
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run archi setup 2>&1 | tee setup.log
          if grep -q "staat niet meer online" setup.log; then
            echo "::error::De gepinde Archi-versie staat niet meer online; verhoog ARCHI_VERSION in tools/archi_tool/engine.py."
            fallback=1
          fi
          cp tests/fixtures/klein-model.archimate e2e-model.archimate
          # Archi's CLI vereist op headless Linux een virtueel scherm (xvfb);
          # macOS en Windows hebben dat niet nodig. --model is globaal en staat
          # vóór het subcommando.
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libswt-gtk-4-java >/dev/null 2>&1 || sudo apt-get install -y -qq xvfb
            xvfb-run -a uv run archi --model e2e-model.archimate normalize
          else
            uv run archi --model e2e-model.archimate normalize
          fi
          echo "normalize geslaagd op ${{ matrix.os }}"
          exit "${fallback:-0}"

  report:
    needs: engine-e2e
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Issue openen of bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="engine-e2e faalt: Archi-engine downloaden of normaliseren werkt niet"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title engine-e2e faalt" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Faalt nog steeds: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
              "De wekelijkse engine-e2e is gefaald: $RUN_URL

          Meestal heeft archi.io een nieuwe Archi-release gepubliceerd en de gepinde versie verwijderd. Verhoog dan \`ARCHI_VERSION\` in \`tools/archi_tool/engine.py\` (zie ADR 0011)."
          fi
