# Echte end-to-end test van de engine-download: haalt de Archi-distributie op
# (of gebruikt de cache) en draait een echte `normalize` op alle drie de
# platforms. Bewust géén onderdeel van de PR-CI: het downloadt ~177 MB en is
# alleen nodig als een nieuwe Archi-release de download-URL of de layout kan
# breken. Draait wekelijks en handmatig.
name: engine-e2e

on:
  schedule:
    - cron: "0 6 * * 1"   # maandag 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - run: uv sync

      # De engine landt in deze map; cache hem op de gepinde Archi-versie zodat
      # een version bump verse download forceert en tussenruns de cache delen.
      - name: Archi-versie bepalen
        id: archi
        shell: bash
        run: |
          version=$(uv run python -c "from archi_tool.engine import ARCHI_VERSION; print(ARCHI_VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Engine-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: engine-cache
          key: archi-engine-${{ matrix.os }}-${{ steps.archi.outputs.version }}

      - name: Engine ophalen (of uit cache) en normalize draaien
        shell: bash
        env:
          ARCHI_CACHE: engine-cache
        run: |
          uv run archi setup
          cp tests/fixtures/klein-model.archimate e2e-model.archimate
          # Archi's CLI vereist op headless Linux een virtueel scherm (xvfb);
          # macOS en Windows hebben dat niet nodig. --model is globaal en staat
          # vóór het subcommando.
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libswt-gtk-4-java >/dev/null 2>&1 || sudo apt-get install -y -qq xvfb
            xvfb-run -a uv run archi --model e2e-model.archimate normalize
          else
            uv run archi --model e2e-model.archimate normalize
          fi
          echo "normalize geslaagd op ${{ matrix.os }}"
