# Checks voor de archi-cli-tool: draait op Ubuntu én Windows zodat
# platformonafhankelijkheid geen papieren claim is. De tool is generiek (werkt
# op elk .archimate-bestand), dus er is geen modelbestand in deze repo om tegen
# te valideren of te renderen; de testsuite werkt op een fixture.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync
      - run: uv run archi --help   # rooktest: de CLI start
      - run: uv run pytest
