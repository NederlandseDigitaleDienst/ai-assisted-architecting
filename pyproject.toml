[project]
name = "archi-cli"
version = "0.2.2"
description = "Deterministische command line tool om native Archi-modellen (.archimate) te inspecteren, muteren, valideren en renderen"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Nederlandse Digitale Dienst" },
]
keywords = ["archimate", "archi", "enterprise-architecture", "cli", "modeling", "architecture-as-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: Dutch",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
# lxml 6.1.3 stops resolving external parameter entities by default
dependencies = ["lxml>=6.1.3", "typer>=0.26"]

[project.urls]
Homepage = "https://github.com/BureauArchitectuurDigitaleOverheid/ai-assisted-architecting"
Repository = "https://github.com/BureauArchitectuurDigitaleOverheid/ai-assisted-architecting"
Issues = "https://github.com/BureauArchitectuurDigitaleOverheid/ai-assisted-architecting/issues"
Changelog = "https://github.com/BureauArchitectuurDigitaleOverheid/ai-assisted-architecting/blob/main/CHANGELOG.md"

[project.scripts]
archi = "archi_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is archi-cli; the import package stays archi_tool and the
# command stays `archi`. Point hatchling at the source tree explicitly.
[tool.hatch.build.targets.wheel]
packages = ["tools/archi_tool"]

[tool.hatch.build.targets.sdist]
# only these paths; the leading ./ anchors README.md so views/README.md and
# other nested READMEs don't get pulled in by a bare glob
include = [
    "/tools/archi_tool",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # line length is left to the formatter
    "B008",  # Typer declares options as call defaults by design
]
