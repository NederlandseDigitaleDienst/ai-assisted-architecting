[project]
name = "archi-tool"
version = "0.1.0"
description = "Deterministische CLI voor het inspecteren, manipuleren en valideren van native .archimate-modellen"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["lxml>=5.0", "typer>=0.26"]

[project.scripts]
archi = "archi_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/archi_tool"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=4"]
