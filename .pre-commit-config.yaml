# Lokaal via `just setup` geïnstalleerd; CI draait dezelfde hooks op alle
# bestanden (job `lint` in .github/workflows/ci.yml), zodat een overgeslagen
# hook niet ongemerkt op main belandt.
exclude: ^tests/fixtures/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format
  # security audit of the GitHub workflows (pinning, permissions, ...)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: pytest
        name: pytest (archi_tool)
        entry: uv run pytest -q
        language: system
        files: ^(tools/|tests/|pyproject\.toml)
        pass_filenames: false
